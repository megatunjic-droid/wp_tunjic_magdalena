<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zastava</title>
    <style>
        .red {
           width: 500px;
           height: 300px;
           position: relative;
           background-color: red;
      
        }
        .blue {
            width: 500px;
            height: 150px;
            background-color: blue;
            position: absolute;
            top: 78px;
            
        } 
        .krug {
            background-color: aliceblue;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            top: 85px;
            left: 180px;
            position: absolute;
        }
        .plava {
            width: 500px;
            height: 300px;
            background-color: blue;
            position: relative;
            
        }
        .yellow_h {
            width: 500px;
            height: 100px;
            background-color: yellow;
            position: absolute;
            top: 100px;
        }
        .yellow_v {
            width: 80px;
            height: 300px;
            background-color: yellow;
            position: absolute;
            left: 100px;
        }
    </style>
</head>
<body>
    <h1>Zastava Laosa</h1>
    <div class="red">
        <div class="blue"></div>
        <div class="krug"></div>
    </div>

    <h1>Zastava Švedske</h1>
    <div class="plava">
        <div class="yellow_h"></div>
        <div class="yellow_v"></div>
    </div>
    
</body>
</html>
